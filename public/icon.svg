<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512' width='512' height='512'>
  <defs>
    <radialGradient id='bgGrad' cx='50%' cy='45%' r='65%'>
      <stop offset='0%' stop-color='#1e293b'/>
      <stop offset='60%' stop-color='#0f172a'/>
      <stop offset='100%' stop-color='#020617'/>
    </radialGradient>
    <linearGradient id='gold' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' stop-color='#fef08a'/>
      <stop offset='30%' stop-color='#f59e0b'/>
      <stop offset='70%' stop-color='#d97706'/>
      <stop offset='100%' stop-color='#92400e'/>
    </linearGradient>
    <linearGradient id='goldLight' x1='0%' y1='0%' x2='100%' y2='0%'>
      <stop offset='0%' stop-color='#fef08a'/>
      <stop offset='100%' stop-color='#f59e0b'/>
    </linearGradient>
    <filter id='glow' x='-20%' y='-20%' width='140%' height='140%'>
      <feGaussianBlur stdDeviation='6' result='blur'/>
      <feComposite in='SourceGraphic' in2='blur' operator='over'/>
    </filter>
  </defs>
  <!-- Background with rounded squircle for iOS & Android -->
  <rect width='512' height='512' rx='112' fill='url(#bgGrad)'/>
  <!-- Outer Gold Border -->
  <rect x='16' y='16' width='480' height='480' rx='98' fill='none' stroke='url(#gold)' stroke-width='4' opacity='0.7'/>
  <circle cx='256' cy='256' r='215' fill='none' stroke='url(#gold)' stroke-width='2' opacity='0.3' stroke-dasharray='6 6'/>
  <circle cx='256' cy='256' r='205' fill='none' stroke='url(#gold)' stroke-width='3' opacity='0.5'/>

  <!-- Stars -->
  <g fill='url(#gold)' transform='translate(256, 95)'>
    <path d='M0 -14 L4 -4 L14 -4 L6 2 L9 12 L0 6 L-9 12 L-6 2 L-14 -4 L-4 -4 Z' />
    <path d='M-38 -12 L-35 -4 L-27 -4 L-33 1 L-31 9 L-38 4 L-45 9 L-43 1 L-49 -4 L-41 -4 Z' opacity='0.8' />
    <path d='M38 -12 L41 -4 L49 -4 L43 1 L45 9 L38 4 L31 9 L33 1 L27 -4 L35 -4 Z' opacity='0.8' />
  </g>

  <!-- Central Crest: Luxury Barber Scissors -->
  <g stroke='url(#gold)' fill='none' stroke-linecap='round' stroke-linejoin='round'>
    <!-- Left Blade -->
    <path d='M180 340 L256 220 L310 135' stroke-width='16'/>
    <!-- Right Blade -->
    <path d='M332 340 L256 220 L202 135' stroke-width='16'/>
    <!-- Scissor Finger Loops -->
    <ellipse cx='165' cy='360' rx='28' ry='36' stroke-width='14'/>
    <ellipse cx='347' cy='360' rx='28' ry='36' stroke-width='16'/>
    <!-- Pivot Screw -->
    <circle cx='256' cy='220' r='10' fill='url(#gold)' stroke='#0f172a' stroke-width='4'/>
  </g>

  <!-- Big Monogram TD in center -->
  <text x='256' y='285' text-anchor='middle' font-family='Arial, sans-serif' font-weight='900' font-size='92' fill='url(#goldLight)' filter='url(#glow)' letter-spacing='4'>TD</text>

  <!-- Ribbon Banner with Brand Name -->
  <path d='M100 405 L412 405 L395 440 L117 440 Z' fill='#020617' stroke='url(#gold)' stroke-width='2'/>
  <text x='256' y='429' text-anchor='middle' font-family='Arial, sans-serif' font-weight='800' font-size='22' fill='url(#gold)' letter-spacing='5'>TARIK DİLEK</text>

  <!-- Subtitle -->
  <text x='256' y='465' text-anchor='middle' font-family='Arial, sans-serif' font-weight='600' font-size='14' fill='#94a3b8' letter-spacing='3'>ERKEK KUAFÖRÜ</text>
</svg>